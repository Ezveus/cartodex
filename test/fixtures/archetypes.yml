# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html
#
# NOTE: archetypes hold a foreign key to cards (their member cards), so only
# reference cards that are not destroyed by other tests (e.g. avoid honedge).
#
# Fixtures skip callbacks, so name_normalized and the denormalised fingerprint pair are
# spelled out by hand; ArchetypeTest asserts both stay in step. A missing secondary is the
# empty string, never NULL — see the migration for why.
#
# The same rule extends to TournamentStanding, whose belongs_to :archetype is required and
# whose cascade off this model is restrict_with_error (a standing is another member's public
# record of a real placement, so an archetype delete must not silently take it out): ogerpon
# and budew_ogerpon are both destroyed by other tests (DeckTest, the archetype-detector
# tie-break test), so neither may be referenced by test/fixtures/tournament_standings.yml.
# froakie is the one kept free of any destroy call for exactly that reason — point standing
# fixtures at it, not at the two above.

ogerpon:
  primary_card: teal_mask_ogerpon_ex
  primary_fingerprint: ogerpon_shared
  secondary_fingerprint: ""
  name: "Teal Mask Ogerpon ex"
  name_normalized: "teal mask ogerpon ex"

budew_ogerpon:
  primary_card: budew_pre
  secondary_card: teal_mask_ogerpon_ex
  primary_fingerprint: budew_shared
  secondary_fingerprint: ogerpon_shared
  name: "Budew / Teal Mask Ogerpon ex"
  name_normalized: "budew / teal mask ogerpon ex"

# Nothing destroys this one — see the note above. Kept as a single-member archetype on a card
# no other archetype fixture references. froakie_cri, not froakie_twm, is deliberately avoided
# too: ArchetypeTest renames that card's name to "Flittle" mid-test to prove the search scope
# reads the secondary Pokémon's column, and a second archetype whose *primary* is that same
# card would incidentally match "Flittle" through its own primary_card join and break the
# "must not match without the secondary" half of that test.
froakie:
  primary_card: froakie_twm
  primary_fingerprint: froakie_twm_fp
  secondary_fingerprint: ""
  name: "Froakie"
  name_normalized: "froakie"
