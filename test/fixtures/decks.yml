# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html
#
# NOTE: fixtures skip callbacks, so name_normalized and key are spelled out by hand.
# DeckTest asserts name_normalized stays in step with name, and that every row has a key —
# `decks.key` is NOT NULL, so a row without one fails to insert and takes the suite with it.
# These are readable rather than 22 characters; only generated keys are that length.

one:
  user: one
  name: MyString
  name_normalized: mystring
  description: MyText
  standard_pool: twm_por
  key: deck-one-key

two:
  user: two
  name: MyString
  name_normalized: mystring
  description: MyText
  standard_pool: twm_por
  key: deck-two-key

# An ownerless deck is a tournament field list: no user, shared (so /decks/shared is a listing
# that can show it at all) and never physical. DeckTest asserts those two rules; the audit
# regressions in DecksControllerTest, Search::GlobalTest and the two admin tests read this row.
field_list:
  name: Ash Ketchum — Regional Championship (2026-03-14)
  name_normalized: ash ketchum — regional championship (2026-03-14)
  standard_pool: twm_por
  key: deck-field-list-key
  shared: true
