# NOTE: fixtures skip callbacks, so player_name_normalized is spelled out by hand.
# TournamentStandingTest asserts it stays in step with player_name.
#
# Two rows on tournaments(:one) — the event tournament_entries(:one) and (:shared_event) point
# at — so a controller test has both a claimed-to-be and an unclaimed row to work with.

# archetype: standings_marker on both rows, deliberately — see the note in archetypes.yml.
# Neither ogerpon nor budew_ogerpon may be referenced here, and neither may any other existing
# archetype fixture: TournamentStanding's cascade off Archetype is restrict_with_error, so this
# needs a fixture nothing else in the suite destroys, renames, or builds decks from.

ash_masters:
  tournament: one
  player_name: Ash Ketchum
  player_name_normalized: ash ketchum
  division: masters
  placement: 33
  wins: 6
  losses: 3
  ties: 0
  archetype: standings_marker
  created_by: one

giovanni_masters:
